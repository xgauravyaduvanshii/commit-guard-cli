name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test the built CLI on the fixtures
        run: |
          node dist/cli.js scan fixtures/repo-clean
          if node dist/cli.js scan fixtures/repo-with-secret; then echo "expected the secret fixture to be blocked" && exit 1; fi
